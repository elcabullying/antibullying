<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz Segura - Canal de Denúncias</title>
    <style>
        :root {
            --primary: #8367C7;
            --primary-hover: #6B4EB3;
            --bg-color: #F4F0FA;
            --card-bg: #FFFFFF;
            --text-color: #1A1C24;
            --text-muted: #706F78;
            --border-color: #E2D9F3;
            --error-color: #E53935;
            --success-color: #2E7D32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #FAFAFA;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #FFFFFF;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: #CCC;
            cursor: not-allowed;
        }

        #feedback {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            text-align: center;
        }

        #feedback.success {
            display: block;
            background-color: #E8F5E9;
            color: var(--success-color);
            border: 1px solid #A5D6A7;
        }

        #feedback.error {
            display: block;
            background-color: #FFEBEE;
            color: var(--error-color);
            border: 1px solid #FFCDD2;
        }

        .anonymous-note {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🛡️ Voz Segura</h1>
            <p>Canal seguro e confidencial para envio de relatos de bullying.</p>
        </div>

        <form id="formRelato">
            <div class="form-group">
                <label for="nome">Seu Nome (Opcional):</label>
                <input type="text" id="nome" name="nome" placeholder="Deixe em branco para enviar anonimamente">
                <p class="anonymous-note">Caso prefira não se identificar, deixe este campo em branco.</p>
            </div>

            <div class="form-group">
                <label for="turma">Série / Turma (Opcional):</label>
                <input type="text" id="turma" name="turma" placeholder="Ex: 9º Ano A, 2º Ano Ensino Médio">
            </div>

            <div class="form-group">
                <label for="vitima_testemunha">Você é:*</label>
                <select id="vitima_testemunha" name="vitima_testemunha" required>
                    <option value="">Selecione uma opção...</option>
                    <option value="Vítima">Vítima (aconteceu comigo)</option>
                    <option value="Testemunha">Testemunha (presenciei com outra pessoa)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo_bullying">Tipo de Ocorrência:*</label>
                <select id="tipo_bullying" name="tipo_bullying" required>
                    <option value="">Selecione uma opção...</option>
                    <option value="Verbal">Verbal (insultos, piadas, xingamentos)</option>
                    <option value="Físico">Físico (agressões, empurrões, danos a objetos)</option>
                    <option value="Psicológico / Social">Psicológico / Social (exclusão, fofocas, ameaças)</option>
                    <option value="Cyberbullying">Cyberbullying (mensagens na internet/redes sociais)</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="local">Onde costuma acontecer?*</label>
                <input type="text" id="local" name="local" placeholder="Ex: Pátio da escola, Sala de aula, WhatsApp" required>
            </div>

            <div class="form-group">
                <label for="frequencia">Com que frequência ocorre?*</label>
                <select id="frequencia" name="frequencia" required>
                    <option value="">Selecione...</option>
                    <option value="Ocorreu apenas uma vez">Ocorreu apenas uma vez</option>
                    <option value="Algumas vezes no mês">Algumas vezes no mês</option>
                    <option value="Semanalmente">Semanalmente</option>
                    <option value="Diariamente">Diariamente</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao">Descreva o que aconteceu:*</label>
                <textarea id="descricao" name="descricao" placeholder="Conte detalhes sobre o ocorrido com calma..." required></textarea>
            </div>

            <button type="submit" id="btnEnviar" class="btn-submit">Enviar Relato com Segurança</button>
        </form>

        <div id="feedback"></div>
    </div>

    <script>
        const form = document.getElementById('formRelato');
        const btnEnviar = document.getElementById('btnEnviar');
        const feedback = document.getElementById('feedback');

        form.addEventListener('submit', async (e) => {
            // Evita que a página seja recarregada ao enviar o formulário
            e.preventDefault();

            // Bloqueia o botão e dá feedback visual de envio
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Enviando relato...';
            feedback.className = '';
            feedback.style.display = 'none';

            // Monta o objeto com os dados digitados
            const dados = {
                nome: document.getElementById('nome').value,
                turma: document.getElementById('turma').value,
                vitima_testemunha: document.getElementById('vitima_testemunha').value,
                tipo_bullying: document.getElementById('tipo_bullying').value,
                local: document.getElementById('local').value,
                frequencia: document.getElementById('frequencia').value,
                descricao: document.getElementById('descricao').value
            };

            try {
                // Rota relativa: '/api/relato' funciona tanto local quanto na Vercel
                const response = await fetch('/api/relato', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (response.ok && resultado.success) {
                    feedback.className = 'success';
                    feedback.textContent = '✅ Relato enviado com sucesso! Obrigado pela sua contribuição.';
                    form.reset();
                } else {
                    feedback.className = 'error';
                    feedback.textContent = `❌ ${resultado.mensagem || 'Ocorreu um erro ao processar seu relato.'}`;
                }
            } catch (error) {
                console.error('Erro de requisição:', error);
                feedback.className = 'error';
                feedback.textContent = '❌ Erro de conexão ao enviar o relato. Verifique sua rede e tente novamente.';
            } finally {
                // Reativa o botão
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Enviar Relato com Segurança';
            }
        });
    </script>
</body>
</html>
